
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  steps:
    - name: cleanup
      image: alpine:3.18
      script: |
        #!/bin/sh
        echo "Cleaning workspace"

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: git-clone
spec:
  params:
    - name: repo-url
      type: string
  steps:
    - name: clone
      image: alpine/git:latest
      script: |
        #!/bin/sh
        echo "Cloning repository"
        git clone "$(params.repo-url)" /workspace/source
